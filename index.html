<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポートフォリオ</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <strong>My Portfolio</strong>
        <button class="menu-toggle" aria-label="メニュー">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav>
            <div class="nav-item">
                <a href="#about">About</a>
                <div class="submenu">
                    <a href="#profile">Profile</a>
                    <a href="#skill">Skill</a>
                    <a href="#education">Education</a>
                </div>
            </div>
            <a href="#works">Works</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>
    <main>
        <section id="about">
            <h2>About Me</h2>
            <h3 id="profile">profile</h3>
            <p>大阪公立大学工業高等専門学校知能情報コースに在籍しています。</p>
            <h3 id="skill">skill</h3>
            <p>以下が私が活用可能な言語、ツールです</p>
            <div class="skill-container">
                <div class="skill-item">
                    <img src="images/Cpp.png" alt="Cpp">
                    <span>C++</span>
                </div>
                <div class="skill-item">
                    <img src="images/Python.jpeg" alt="Python">
                    <span>Python</span>
                </div>
                <div class="skill-item">
                    <img src="images/ros2.png" alt="ROS2">
                    <span>ROS2</span>
                </div>
                <div class="skill-item">
                    <img src="images/Docker.png" alt="Docker">
                    <span>Docker</span>
                </div>
                <!-- 必要なスキルを追加 -->
            </div>
        </section>
        <section id="works">
            <h2>Works</h2>
            <p>プロジェクト紹介など。</p>
        </section>
        <section id="contact">
            <h2>Contact</h2>
            <p>連絡先など。</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
